# ============================================================
# 开发环境配置 — 仅覆盖与 application.yml 不同的项
# 相同配置（mybatis-plus、check、ai、report、review 等）已在 application.yml 中定义，无需重复
# ============================================================

server:
  port: 8080

# 对象存储（开发环境使用局域网MinIO）
minio:
  endpoint: ${MINIO_ENDPOINT:http://192.168.30.128:9000}

spring:
  # 数据源（开发环境直连本地MySQL）
  datasource:
    url: jdbc:mysql://localhost:3306/check-repeat-system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3

  # Redis（开发环境直连本地）
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  # JWT（必须通过环境变量设置）
  jwt:
    secret-key: ${JWT_SECRET_KEY}

# 管理员规则配置（开发环境放宽查重间隔）
admin:
  check-rule:
    default-interval: 86400

# 报告存储路径（开发环境使用相对路径）
report:
  storage:
    base-path: ${REPORT_STORAGE_PATH:./data/report}

# 审核附件存储路径（开发环境使用相对路径）
review:
  attach:
    base-path: /data/review-attach/

# WebSocket 允许的来源（开发环境）
websocket:
  allowed-origins: http://localhost:3000,http://localhost:5173

# 文件上传路径（开发环境使用相对路径）
file:
  upload:
    base-path: ${UPLOAD_BASE_PATH:./upload/}

# 查重临时文件路径（开发环境）
check:
  task:
    temp-file-path: /data/check-temp/

# 头像存储路径（开发环境使用相对路径）
avatar:
  storage:
    base-path: ${AVATAR_STORAGE_PATH:./data/avatar-storage}

# 论文查重报告路径（开发环境使用相对路径）
paper-check:
  report-storage-path: ${CHECK_REPORT_PATH:./check-report/}
